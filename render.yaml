# Publicación en Render (plan gratis, para PRUEBAS).
# En Render: New → Blueprint → elegir este repositorio. Crea la base de datos y el sitio.
databases:
  - name: mediconnect-db
    plan: free
    databaseName: mediconect
    user: mediconect
    region: oregon

services:
  - type: web
    name: mediconnect
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/salud
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mediconnect-db
          property: connectionString
      # Claves secretas: Render genera valores aleatorios
      - key: JWT_SECRET
        generateValue: true
      - key: IPS_API_KEY
        generateValue: true
      # Usuario administrador: la contraseña se escribe en Render al crear el sitio
      - key: ADMIN_USUARIO
        value: admin
      - key: ADMIN_CLAVE
        sync: false
      # Sitio de pruebas: activa el simulador de la IPS para crear fórmulas de prueba.
      # En el sitio real debe ser "false".
      - key: MODO_DEMO
        value: "true"
      # Correo (opcional): sin estos datos, los correos se ven en los registros (Logs) de Render
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USUARIO
        sync: false
      - key: SMTP_CLAVE
        sync: false
      - key: CORREO_REMITENTE
        sync: false
